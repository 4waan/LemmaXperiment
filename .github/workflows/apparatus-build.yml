name: apparatus-build

# Builds the pinned RSP host and the lemma-prove wrapper once, and keeps the
# binaries as artifacts so execute/prove jobs never rebuild.
#
# Two variants, same sources and same guest ELF:
#   standard        the pinned default; the only build used for proofs and
#                   for any timing that counts
#   cycle-tracking  bin/host's `cycle-tracking` feature (sp1-sdk/profiling):
#                   the SP1 executor keeps the guest's cycle-tracker labels,
#                   so report.csv gets per-phase cycles. Diagnostics only.

on:
  workflow_dispatch:
  push:
    paths:
      - apparatus/pins.json
      - apparatus/prover/**
      - .github/workflows/apparatus-build.yml

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        variant: [standard, cycle-tracking]
    name: build (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      VARIANT: ${{ matrix.variant }}
      # `pkg/feature` form so the flag is explicit per package: rsp is bin/host.
      CARGO_FEATURES: ${{ matrix.variant == 'cycle-tracking' && '--features rsp/cycle-tracking,lemma-prove/cycle-tracking' || '' }}
      ARTIFACT_SUFFIX: ${{ matrix.variant == 'cycle-tracking' && '-cycle-tracking' || '' }}
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Free disk (runner ships with ~14 GB free)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: Read pins
        id: pins
        run: |
          echo "rsp_commit=$(jq -r .rsp.commit apparatus/pins.json)" >> "$GITHUB_OUTPUT"
          echo "sp1_ver=$(jq -r .sp1.cargoProveToolchain apparatus/pins.json)" >> "$GITHUB_OUTPUT"

      - name: Clone RSP at pin
        run: |
          git clone https://github.com/succinctlabs/rsp rsp
          git -C rsp checkout -q ${{ steps.pins.outputs.rsp_commit }}
          git -C rsp rev-parse HEAD

      - name: Install build deps
        run: sudo apt-get install -y -qq protobuf-compiler libssl-dev pkg-config clang >/dev/null

      - name: Install SP1 toolchain
        # sp1up and `cargo prove install-toolchain` read GitHub releases through
        # the API; unauthenticated calls share the hosted-runner IP's quota and
        # get 403 rate-limited. The job token lifts that.
        run: |
          curl -L https://sp1up.succinct.xyz | bash
          echo "$HOME/.sp1/bin" >> "$GITHUB_PATH"
          "$HOME/.sp1/bin/sp1up" -v v${{ steps.pins.outputs.sp1_ver }} --token "${{ github.token }}"
          "$HOME/.sp1/bin/cargo-prove" prove --version

      - name: Inject lemma-prove into the workspace
        run: |
          mkdir -p rsp/bin/lemma-prove/src
          cp apparatus/prover/Cargo.toml apparatus/prover/build.rs rsp/bin/lemma-prove/
          cp apparatus/prover/src/*.rs rsp/bin/lemma-prove/src/
          cp rsp/bin/host/src/cli.rs rsp/bin/host/src/execute.rs rsp/bin/lemma-prove/src/
          sed -i 's|    "bin/host",|    "bin/host",\n    "bin/lemma-prove",|' rsp/Cargo.toml
          git -C rsp diff --stat

      # No Rust cache on purpose: sp1-core-executor-runner's build script
      # writes a native binary into its registry source dir, and a restored
      # target/ marks that script fresh while the source dir is re-extracted
      # empty. The build runs once per pin, so caching buys little.

      - name: Build
        working-directory: rsp
        run: cargo build --release -p rsp -p lemma-prove $CARGO_FEATURES

      - name: Build record
        run: |
          mkdir -p dist
          cp rsp/target/release/rsp rsp/target/release/lemma-prove rsp/target/release/lemma-wrap dist/
          {
            echo "built_at: $(date -u +%FT%TZ)"
            echo "variant: $VARIANT"
            echo "cargo_features: ${CARGO_FEATURES:-(none)}"
            echo "runner: ${{ runner.os }} ${{ runner.arch }} $(nproc) vcpu $(free -g | awk '/Mem/{print $2}') GB"
            echo "rsp_commit: $(git -C rsp rev-parse HEAD)"
            echo "workspace_edit: added member bin/lemma-prove (see apparatus/prover)"
            echo "cargo_prove: $(cargo prove --version 2>&1 | head -1)"
            echo "rustc: $(cd rsp && rustc --version)"
            echo "rsp_sha256: $(sha256sum dist/rsp | cut -d' ' -f1)"
            echo "lemma_prove_sha256: $(sha256sum dist/lemma-prove | cut -d' ' -f1)"
            echo "lemma_wrap_sha256: $(sha256sum dist/lemma-wrap | cut -d' ' -f1)"
            # The guest ELF sp1-build produced for bin/client; both variants must agree.
            find rsp -path '*/elf-compilation/*' -type f -name rsp-client -exec sh -c 'for f; do echo "guest_elf: $f sha256=$(sha256sum "$f" | cut -d" " -f1)"; done' _ {} +
          } | tee dist/build-record.txt
          df -h / | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: rsp-host-${{ steps.pins.outputs.rsp_commit }}${{ env.ARTIFACT_SUFFIX }}
          path: dist/
          retention-days: 90
          if-no-files-found: error
