name: apparatus-prove

# CPU-proves one small mainnet block. Hours, not minutes; the 6 hour job cap
# is the hard limit, so keep blocks under a few million gas. Proving wall
# time here is recorded but is never a benchmark.

on:
  workflow_dispatch:
    inputs:
      block:
        description: mainnet block number (small)
        default: "20600066"
        required: true
      proof_mode:
        description: compressed or groth16
        default: compressed
        required: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      RPC_1: ${{ secrets.RPC_1 }}
      SP1_PROVER: cpu
      SP1_LOG: debug
      # SP1 6.8.0 CPU prover defaults target large machines (2^24-cycle shards,
      # 4 concurrent core workers, 8 recursion workers). On a 16 GB runner that
      # is killed within a minute. These settings trade time for memory. They
      # change how the proof is produced, not what is proven: same guest, same
      # vkey, same verifier.
      SHARD_SIZE: "524288"
      ELEMENT_THRESHOLD: "33554432"
      TRACE_CHUNK_SLOTS: "2"
      SP1_WORKER_NORMALIZE_PROGRAM_CACHE_SIZE: "1"
      SP1_WORKER_NUM_CORE_WORKERS: "1"
      SP1_WORKER_CORE_BUFFER_SIZE: "1"
      SP1_WORKER_NUM_SETUP_WORKERS: "1"
      SP1_WORKER_SETUP_BUFFER_SIZE: "1"
      SP1_WORKER_NUM_SPLICING_WORKERS: "1"
      SP1_WORKER_SPLICING_BUFFER_SIZE: "1"
      SP1_WORKER_NUM_RECURSION_EXECUTOR_WORKERS: "1"
      SP1_WORKER_RECURSION_EXECUTOR_BUFFER_SIZE: "1"
      SP1_WORKER_NUM_RECURSION_PROVER_WORKERS: "1"
      SP1_WORKER_RECURSION_PROVER_BUFFER_SIZE: "1"
      SP1_WORKER_NUM_PREPARE_REDUCE_WORKERS: "1"
      SP1_WORKER_PREPARE_REDUCE_BUFFER_SIZE: "1"
      SP1_WORKER_NUM_DEFERRED_WORKERS: "1"
      SP1_WORKER_DEFERRED_BUFFER_SIZE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Free disk and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          # /swapfile is the runner's stock 2 GB swap, so use a new path. Each
          # command on its own line so a failure fails the step.
          sudo fallocate -l 24G /swapfile2
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2 >/dev/null
          sudo swapon /swapfile2
          swapon --show
          df -h / | tail -1; free -g | head -3

      - name: Fetch binaries from the latest successful build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(jq -r .rsp.commit apparatus/pins.json)
          run_id=$(gh run list -R "$GITHUB_REPOSITORY" -w apparatus-build -s success -L 1 --json databaseId -q '.[0].databaseId')
          gh run download "$run_id" -R "$GITHUB_REPOSITORY" -n "rsp-host-$commit" -D dist
          chmod +x dist/rsp dist/lemma-prove

      - name: Witness cache
        uses: actions/cache@v4
        with:
          path: cache
          key: witness-${{ inputs.block }}-proofs

      - name: Prove
        run: |
          mkdir -p run cache
          # Sampler writes to the job log (streams live, survives a VM kill)
          # and to a file for the run record.
          ( while true; do line="$(date -u +%T) $(free -m | awk '/Mem/{print "mem_used_mb="$3} /Swap/{print "swap_used_mb="$3}' | xargs)"; echo "MEMSAMPLE $line"; echo "$line" >> run/memory.log; sleep 30; done ) &
          sampler=$!
          start=$(date +%s)
          dist/lemma-prove --block-number ${{ inputs.block }} --chain-id 1 --rpc-url "$RPC_1" \
            --cache-dir cache --prove --proof-mode ${{ inputs.proof_mode }} \
            --out-dir run/out --report-path run/report.csv 2>&1 | tee run/stdout.log
          end=$(date +%s)
          kill $sampler 2>/dev/null || true
          {
            echo "block: ${{ inputs.block }}"
            echo "mode: prove ${{ inputs.proof_mode }}"
            echo "sp1_prover: cpu"
            echo "wall_seconds: $((end - start))"
            echo "runner: $(nproc) vcpu $(free -g | awk '/Mem/{print $2}') GB (shared GitHub runner, not a benchmark)"
            echo "lemma_prove_sha256: $(sha256sum dist/lemma-prove | cut -d' ' -f1)"
            echo "peak_mem_used_mb: $(awk -F'mem_used_mb=' '{split($2,a," "); if(a[1]>m)m=a[1]} END{print m}' run/memory.log)"
            echo "peak_swap_used_mb: $(awk -F'swap_used_mb=' '{split($2,a," "); if(a[1]>m)m=a[1]} END{print m}' run/memory.log)"
            echo "prover_env: SHARD_SIZE=$SHARD_SIZE ELEMENT_THRESHOLD=$ELEMENT_THRESHOLD one worker per stage"
          } | tee run/run.txt
          cat run/out/*.proving.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prove-${{ inputs.block }}-${{ inputs.proof_mode }}-${{ github.run_id }}
          path: run/
          retention-days: 90
