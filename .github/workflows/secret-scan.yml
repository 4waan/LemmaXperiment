name: secret-scan

# gitleaks over the full history with the project rules (.gitleaks.toml:
# provider keys inside RPC URLs, EVM private keys, plus the defaults) on every
# push and pull request. The same binary runs locally in .githooks/pre-commit.
# A finding fails the job; rotate first, then scrub (.claude/skills/secret-scan).

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks version
      - name: Scan history
        run: ./gitleaks detect --no-banner --redact --exit-code 1
      - name: Tracked files that must never be tracked
        run: |
          bad=$(git ls-files | grep -iE '(^|/)\.env$|\.pem$|id_rsa|\.p12$|\.key$' || true)
          [ -z "$bad" ] || { echo "tracked secret-like files:"; echo "$bad"; exit 1; }
          echo "none"
