[package]
name = "lemma-prove"
version = "0.1.0"
edition = "2021"
description = "Thin wrapper over the pinned rsp-host-executor that also saves stdin, proof, vkey and timings."

# Injected into the pinned RSP workspace at build time as bin/lemma-prove so
# every dependency resolves to the workspace's exact versions. See
# .github/workflows/apparatus-build.yml.

[dependencies]
tokio.workspace = true
url.workspace = true
tracing-subscriber = "0.3.18"
dotenv = "0.15.0"
clap = { version = "4.5.7", features = ["derive", "env"] }
eyre = "0.6.12"
serde_json.workspace = true
csv = "1.1"
bincode = "1.3"

rsp-client-executor.workspace = true
rsp-host-executor.workspace = true
rsp-primitives.workspace = true
rsp-provider.workspace = true

alloy-chains.workspace = true
alloy-genesis.workspace = true
alloy-primitives.workspace = true
alloy-consensus.workspace = true
alloy-provider.workspace = true
reth-primitives-traits.workspace = true
revm-bytecode.workspace = true

sp1-sdk.workspace = true
sp1-core-executor.workspace = true
strum = "0.27"

[build-dependencies]
sp1-build.workspace = true
