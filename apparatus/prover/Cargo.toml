[package]
name = "lemma-prove"
version = "0.1.0"
edition = "2021"
description = "Thin wrapper over the pinned rsp-host-executor that also saves stdin, proof, vkey and timings."

# Injected into the pinned RSP workspace at build time as bin/lemma-prove so
# every dependency resolves to the workspace's exact versions. See
# .github/workflows/apparatus-build.yml.

[dependencies]
tokio.workspace = true
url.workspace = true
tracing = "0.1"
tracing-subscriber = "0.3.18"
dotenv = "0.15.0"
clap = { version = "4.5.7", features = ["derive", "env"] }
eyre = "0.6.12"
serde_json.workspace = true
csv = "1.1"
bincode = "1.3"

rsp-client-executor.workspace = true
rsp-host-executor.workspace = true
rsp-primitives.workspace = true
rsp-provider.workspace = true

alloy-chains.workspace = true
alloy-genesis.workspace = true
alloy-primitives.workspace = true
alloy-consensus.workspace = true
alloy-provider.workspace = true
reth-primitives-traits.workspace = true
revm-bytecode.workspace = true

sp1-sdk.workspace = true
sp1-core-executor.workspace = true
strum = "0.27"

# lemma-wrap only. Pinned to the exact versions in the RSP Cargo.lock.
sp1-prover = "=6.8.0"
sp1-hypercube = "=6.8.0"
sp1-primitives = "=6.8.0"
sp1-recursion-circuit = "=6.8.0"
sp1-recursion-compiler = "=6.8.0"
sp1-recursion-executor = "=6.8.0"
sp1-recursion-gnark-ffi = "=6.8.0"
slop-algebra = "=6.8.0"
slop-bn254 = "=6.8.0"
hex = "0.4"

[features]
# Mirrors bin/host at the pin: the upstream arena MPT backend (unaudited) for
# host witness emission and, through build.rs, for the guest ELF. This is the
# registered existing capability and the evaluator's counterfactual
# (ROBINHOOD_CHAIN_PROD.md I-E9); it changes the guest, so its vkey differs.
arena = ["rsp-host-executor/arena", "rsp-client-executor/arena"]
# Mirrors bin/host at the pin. `sp1-sdk/profiling` makes the SP1 executor parse
# the guest's `cycle-tracker-report-*` lines into ExecutionReport.cycle_tracker,
# which is where the per-phase CSV columns come from; without it they read 0.
# It also switches SP1 from the native x86_64 executor to the portable
# interpreter, so execution is slower. Diagnostics only: never used for
# proving or for holdout timing.
cycle-tracking = ["sp1-sdk/profiling"]

[[bin]]
name = "lemma-prove"
path = "src/main.rs"

[[bin]]
name = "lemma-wrap"
path = "src/wrap.rs"

[build-dependencies]
sp1-build.workspace = true
