[workspace.package]
[package]
name = "lemma-client"
description = "Settlement guest: the pinned block execution plus the nine public values UsageEscrow checks"
edition = "2021"

# Injected into the pinned RSP checkout as bin/lemma-client next to bin/client,
# with bin/client's Cargo.lock copied alongside so every dependency resolves to
# the pinned versions. Built by the host binaries' build.rs like rsp-client.

[dependencies]
bincode = "1.3.3"
serde = { version = "1.0", features = ["derive"] }

# workspace
rsp-client-executor = { path = "../../crates/executor/client" }

# sp1
sp1-zkvm = "=6.8.0"

# Statically turns off logging
log = { version = "0.4", features = ["max_level_off", "release_max_level_off"] }
tracing = { version = "0.1", features = ["max_level_off", "release_max_level_off"] }

[features]
default = []
# Same meaning as on rsp-client: the arena MPT backend, matched to the host.
arena = ["rsp-client-executor/arena"]

[patch.crates-io]
# Precompile patches, identical to bin/client at the pin
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", tag = "patch-sha2-0.10.9-sp1-6.0.0", package = "sha2" }
bn = { git = "https://github.com/sp1-patches/bn", tag = "patch-0.6.0-sp1-6.0.0", package = "substrate-bn-succinct-rs" }
sha3 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", tag = "patch-sha3-0.11.0-sp1-6.0.0" }
k256 = { git = "https://github.com/sp1-patches/elliptic-curves", tag = "patch-k256-13.4-sp1-6.0.0" }
p256 = { git = "https://github.com/sp1-patches/elliptic-curves", tag = "patch-p256-13.2-sp1-6.0.0" }
