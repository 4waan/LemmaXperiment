[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
# Groth16Verifier.sol from sp1-contracts v6.1.0 pins `pragma solidity 0.8.20`;
# everything else is ^0.8.20, so one compiler serves the whole project.
solc = "0.8.20"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
fs_permissions = [
    { access = "read", path = "./test/fixtures" },
    { access = "read-write", path = "./deployments" },
]

[rpc_endpoints]
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"
arbitrum_sepolia = "${RPC_421614}"

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 32
fail_on_revert = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
